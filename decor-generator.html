<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White House Redesign Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
    <style>
        /* Tacky Velvet Background */
        body {
            background: radial-gradient(circle at center, #8a0303 0%, #3b0000 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-center;
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
        }

        /* Ostentatious Gold Frame */
        .gold-plaque {
            background: linear-gradient(135deg, #2a0000 0%, #4a0000 100%);
            border: 16px ridge #d4af37;
            box-shadow: 
                0 0 40px rgba(0,0,0,0.9), 
                inset 0 0 30px rgba(0,0,0,0.8),
                0 0 15px #d4af37;
            position: relative;
        }

        /* Decorative Corner Accents */
        .gold-plaque::before, .gold-plaque::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #fcf6ba;
            border-radius: 50%;
            box-shadow: 0 0 10px #bf953f;
        }
        .gold-plaque::before { top: 10px; left: 10px; }
        .gold-plaque::after { bottom: 10px; right: 10px; }

        .corner-tl { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border: 4px solid #fcf6ba; border-radius: 50%; box-shadow: 0 0 10px #bf953f; }
        .corner-br { position: absolute; bottom: 10px; left: 10px; width: 40px; height: 40px; border: 4px solid #fcf6ba; border-radius: 50%; box-shadow: 0 0 10px #bf953f; }

        /* Gaudy Gold Text */
        .gold-text {
            font-family: 'Cinzel Decorative', cursive;
            background: linear-gradient(to bottom, #fcf6ba 20%, #bf953f 40%, #b38728 60%, #fbf5b7 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* Generated Text Styling */
        .quote-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            line-height: 1.4;
            color: #f8e5b0;
            text-shadow: 2px 2px 4px #000;
            font-style: italic;
        }

        /* Over-the-top Button */
        .tacky-btn {
            background: linear-gradient(to bottom, #fcf6ba, #bf953f, #aa771c);
            border: 4px solid #fff3d8;
            color: #3b0000;
            font-family: 'Cinzel Decorative', cursive;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.7);
            transition: all 0.2s ease-in-out;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        
        .tacky-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 20px #fcf6ba, inset 0 2px 5px rgba(255,255,255,0.9);
            filter: brightness(1.1);
        }
        
        .tacky-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* Velvet curtain effect overlay */
        .curtain-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                rgba(0,0,0,0.05) 0px,
                rgba(0,0,0,0.1) 20px,
                rgba(0,0,0,0.05) 40px
            );
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="flex justify-center items-center p-4 sm:p-8">
    
    <div class="curtain-overlay"></div>

    <main class="w-full max-w-4xl z-20">
        <!-- Main Plaque Container -->
        <div class="gold-plaque rounded-sm p-8 sm:p-12 md:p-16 text-center relative flex flex-col items-center justify-center min-h-[60vh]">
            
            <!-- Extra corners for maximum tackiness -->
            <div class="corner-tl"></div>
            <div class="corner-br"></div>

            <h1 class="gold-text text-3xl sm:text-4xl md:text-5xl lg:text-6xl mb-8 tracking-wider">
                Presidential <br/> Redesign
            </h1>
            
            <div class="w-full h-1 bg-gradient-to-r from-transparent via-[#bf953f] to-transparent mb-8"></div>
            
            <div class="min-h-[150px] flex items-center justify-center my-6 w-full">
                <!-- Generator Output -->
                <p id="output" class="quote-text text-center px-4 font-bold">
                    <!-- Text will be injected here via JS -->
                </p>
            </div>

            <div class="w-full h-1 bg-gradient-to-r from-transparent via-[#bf953f] to-transparent mt-8 mb-10"></div>

            <button id="generate-btn" class="tacky-btn px-8 py-4 rounded-full text-xl sm:text-2xl cursor-pointer">
                Reveal New Room
            </button>
            
        </div>
    </main>

    <script>
        // Arrays containing our generation elements
        const rooms = [
            "The Oval Office",
            "The Situation Room",
            "The Lincoln Bedroom",
            "The Rose Garden",
            "The Blue Room",
            "The Press Briefing Room",
            "The State Dining Room",
            "The East Room",
            "The Green Room",
            "The Cabinet Room",
            "The Chief of Staff's Office",
            "The White House Bowling Alley",
            "The China Room",
            "The Red Room",
            "The Vermeil Room",
            "The Diplomatic Reception Room",
            "The Map Room",
            "The Treaty Room",
            "The Queens' Bedroom",
            "The Cross Hall",
            "The Truman Balcony"
        ];

        const concepts = [
            "a Cheesecake Factory",
            "a Spirit Halloween store",
            "a 1980s roller rink",
            "a Las Vegas wedding chapel",
            "a discount cruise ship buffet",
            "a Chuck E. Cheese ball pit",
            "a roadside motel",
            "a tacky McMansion",
            "an abandoned shopping mall",
            "a velvet-lined sensory deprivation tank",
            "a mid-tier luxury car dealership",
            "a tiger sanctuary enclosure",
            "a 1970s fondue lounge",
            "a vaporwave mall",
            "a sequin factory",
            "an abandoned Rainforest Cafe",
            "a reality TV confessional booth",
            "a laser tag arena",
            "a 24-hour diner at 3 AM",
            "a mall kiosk selling rhinestone phone cases",
            "a miniature golf course windmill",
            "a novelty tourist trap gift shop"
        ];

        const designers = [
            "Saddam Hussein",
            "Liberace",
            "Muammar Gaddafi",
            "Elton John",
            "Kim Jong Un",
            "RuPaul",
            "Nicolae Ceaușescu",
            "Elvira",
            "Idi Amin",
            "John Waters",
            "Joe Exotic",
            "Marie Antoinette",
            "Mobutu Sese Seko",
            "Dolly Parton",
            "Fidel Castro",
            "Donatella Versace",
            "Richard Simmons",
            "Benito Mussolini",
            "Jeff Koons",
            "Vladimir Putin",
            "Orson Welles",
            "Paul Lynde",
            "Divine",
            "Cher",
            "Lady Gaga",
            "Boy George",
            "Freddie Mercury",
            "Karl Lagerfeld",
            "Tim Curry",
            "Amanda Lepore",
            "Pete Burns",
            "Bette Midler",
            "Liza Minnelli",
            "Little Richard",
            "David Bowie"
        ];

        // Utility to grab a random element from an array
        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Logic to generate and display the phrase
        function generateRoom() {
            const room = getRandomElement(rooms);
            const concept = getRandomElement(concepts);
            const designer = getRandomElement(designers);

            const phrase = `${room} looks like ${concept} designed by ${designer}.`;
            
            const outputElement = document.getElementById('output');
            
            // Brief fade out/in effect for transition
            outputElement.style.opacity = '0';
            
            setTimeout(() => {
                outputElement.innerText = `"${phrase}"`;
                outputElement.style.transition = 'opacity 0.5s ease-in-out';
                outputElement.style.opacity = '1';
            }, 300);
        }

        // Attach event listener
        document.getElementById('generate-btn').addEventListener('click', generateRoom);

        // Generate a room on initial page load
        window.onload = generateRoom;
    </script>
</body>
</html>
